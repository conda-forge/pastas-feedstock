{% set name = "pastas" %}
{% set version = "1.10.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: a3d6e2383abf3af5bdb13930005298ba7b687a585c1224c4ab708ca5b42832d2

build:
  number: 0
  noarch: python
  script: '{{ PYTHON }} -m pip install . --no-deps --ignore-installed -vvv '

requirements:
  host:
    - numpy >=1.10
    - pip
    - python {{ python_min }}
  run:
    - {{ pin_compatible('matplotlib') }}
    - {{ pin_compatible('numpy') }}
    - {{ pin_compatible('pandas') }}
    - python >={{ python_min }}
    - {{ pin_compatible('scipy') }}
    - {{ pin_compatible('numba') }}

test:
  requires:
    - python {{ python_min }}
  imports:
    - pastas

about:
  home: https://github.com/pastas/pastas
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Python Applied System TimeSeries Analysis Software
  doc_url: http://pastas.readthedocs.io
  dev_url: https://github.com/pastas/pastas

extra:
  recipe-maintainers:
    - jentjr
